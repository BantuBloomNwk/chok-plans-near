[package]
name = "judge"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

# Built on its own for OutLayer's TEE workers:
#   cargo build --manifest-path judge/Cargo.toml --target wasm32-wasip2 --release
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
